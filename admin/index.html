<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>MANI — управление</title><link rel="stylesheet" href="/styles.css" /></head><body><main class="admin-shell"><header class="topbar"><a class="brand" href="/">MANI<span>·</span></a><a class="text-button" href="/">К записи клиентов</a></header><p class="eyebrow">Панель администратора</p><h1>Управление салоном</h1><p id="admin-notice" class="form-notice" role="status"></p><div class="admin-grid"><section class="admin-card"><h2>Услуга</h2><form id="service-form"><label>Название<input name="title" maxlength="100" required /></label><label>Длительность, мин.<input name="durationMin" type="number" min="15" max="600" required /></label><label>Цена, ₽<input name="priceRubles" type="number" min="0" step="1" required /></label><button class="primary-button">Добавить <span>→</span></button></form><div id="service-catalog" class="catalog-list"></div></section><section class="admin-card"><h2>Мастер</h2><form id="master-form"><label>Имя<input name="fullName" maxlength="100" required /></label><label>Email<input name="email" type="email" required /></label><label>Временный пароль<input name="password" type="password" minlength="10" required /></label><label>Специализация<input name="specialization" maxlength="200" required /></label><fieldset><legend>Услуги</legend><div id="master-services"></div></fieldset><button class="primary-button">Добавить <span>→</span></button></form></section><section class="admin-card"><h2>График мастера</h2><form id="schedule-form"><label>Мастер<select name="masterId" id="schedule-master" required></select></label><label>День недели<select name="weekday"><option value="1">Понедельник</option><option value="2">Вторник</option><option value="3">Среда</option><option value="4">Четверг</option><option value="5">Пятница</option><option value="6">Суббота</option><option value="7">Воскресенье</option></select></label><label>С<input name="startsAt" type="time" required /></label><label>До<input name="endsAt" type="time" required /></label><button class="primary-button">Сохранить <span>→</span></button></form></section></div><section class="admin-card wide-card"><div class="section-title"><h2>Записи</h2><button class="secondary-button" id="reload">Обновить</button></div><div id="appointments" class="appointments"></div></section></main><script src="/admin.js" defer></script></body></html>
